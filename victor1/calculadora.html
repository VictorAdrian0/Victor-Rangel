<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora - Far Cry 3 Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
  <style>
    /* Fuentes y colores Far Cry 3 */
    :root {
      --fondo: #1a1a1a;
      --rojo-fc3: #d62828;
      --gris-oscuro: #121212;
      --gris-medio: #333;
      --blanco: #f5f5f5;
      --sombra-negra: rgba(0,0,0,0.8);
      --rojo-brillante: #ff3b3b;
      --rojo-hover: #b32121;
    }

    body {
      margin: 0;
      font-family: 'Russo One', sans-serif, Arial, sans-serif;
      background-color: var(--fondo);
      color: var(--blanco);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
    }

    /* Navbar */
    .navbar {
      width: 100%;
      max-width: 450px;
      background: var(--gris-oscuro);
      box-shadow: 0 0 15px var(--sombra-negra);
      border-radius: 10px 10px 0 0;
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 15px 0;
      margin-bottom: 40px;
    }

    .navbar a {
      color: var(--rojo-fc3);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 18px;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .navbar a:hover {
      background: var(--rojo-fc3);
      color: var(--blanco);
      border-radius: 6px;
      box-shadow: 0 0 10px var(--rojo-brillante);
    }

    /* Encabezado */
    .jumbotron {
      max-width: 450px;
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 0 0 8px var(--rojo-brillante);
    }

    .jumbotron h1 {
      font-size: 2rem;
      margin-bottom: 5px;
    }

    .jumbotron h3 {
      font-weight: 400;
      color: var(--rojo-fc3);
      text-transform: uppercase;
      font-size: 1rem;
      letter-spacing: 1.2px;
    }

    /* Calculadora */
    .calc {
      width: 450px;
      background: var(--gris-oscuro);
      border-radius: 20px;
      padding: 25px 30px;
      box-shadow: 0 0 30px var(--sombra-negra);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .calc input[type="text"] {
      width: 100%;
      height: 70px;
      background: var(--gris-medio);
      border: none;
      border-radius: 15px;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--blanco);
      text-align: right;
      padding: 0 20px;
      margin-bottom: 30px;
      box-shadow: inset 0 0 10px var(--sombra-negra);
      letter-spacing: 2px;
      text-shadow: 0 0 3px var(--rojo-brillante);
    }

    /* Botones grid */
    .btn {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .btn input[type="button"] {
      height: 65px;
      border-radius: 15px;
      border: none;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--blanco);
      background-color: var(--rojo-fc3);
      box-shadow: 0 5px 0 #a32222;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      text-shadow: 0 0 5px var(--sombra-negra);
    }

    .btn input[type="button"]:hover {
      background-color: var(--rojo-hover);
      box-shadow: 0 6px 10px var(--rojo-brillante);
      transform: translateY(-3px);
    }

    /* Botones especiales */
    .btn input[value="C"] {
      background-color: #660000;
      box-shadow: 0 5px 0 #440000;
    }
    .btn input[value="C"]:hover {
      background-color: #990000;
      box-shadow: 0 6px 12px #ff0000;
    }

    .btn input[value="←"] {
      background-color: #cc6600;
      box-shadow: 0 5px 0 #994400;
    }
    .btn input[value="←"]:hover {
      background-color: #ff8800;
      box-shadow: 0 6px 12px #ffb733;
    }

    .btn input[value="="] {
      background-color: #005500;
      box-shadow: 0 5px 0 #003300;
      grid-column: span 2;
    }
    .btn input[value="="]:hover {
      background-color: #009900;
      box-shadow: 0 6px 12px #33ff33;
    }

    .btn input[value="0"] {
      grid-column: span 2;
    }

    /* Transiciones */
    * {
      transition: all 0.3s ease;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .calc, .navbar, .jumbotron {
        width: 95%;
      }
      .btn input[type="button"] {
        font-size: 1.2rem;
        height: 55px;
      }
      .calc input[type="text"] {
        height: 55px;
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <a href="index.html">Inicio</a>
    <a href="unidad1.html">Unidad 1</a>
    <a href="unidad2.html">Unidad 2</a>
    <a href="unidad3.html">Unidad 3</a>
  </div>

  <!-- Encabezado -->
  <div class="jumbotron">
    <h1>Victor Adrian Rangel Armendarez</h1>
    <h3>Programación 5A - Construye páginas web</h3>
  </div>

  <!-- Calculadora -->
  <div class="calc">
    <input type="text" id="ans" readonly>
    <div class="btn">
      <input type="button" value="C" onclick="Clear()">
      <input type="button" value="%" onclick="Solve('%')">
      <input type="button" value="←" onclick="Back()">
      <input type="button" value="/" onclick="Solve('/')">

      <input type="button" value="7" onclick="Solve('7')">
      <input type="button" value="8" onclick="Solve('8')">
      <input type="button" value="9" onclick="Solve('9')">
      <input type="button" value="*" onclick="Solve('*')">

      <input type="button" value="4" onclick="Solve('4')">
      <input type="button" value="5" onclick="Solve('5')">
      <input type="button" value="6" onclick="Solve('6')">
      <input type="button" value="-" onclick="Solve('-')">

      <input type="button" value="1" onclick="Solve('1')">
      <input type="button" value="2" onclick="Solve('2')">
      <input type="button" value="3" onclick="Solve('3')">
      <input type="button" value="+" onclick="Solve('+')">

      <input type="button" value="0" onclick="Solve('0')">
      <input type="button" value="." onclick="Solve('.')">
      <input type="button" value="=" onclick="Result()">
    </div>
  </div>

  <script>
    const output = document.getElementById("ans");

    function Solve(val) {
      output.value += val;
    }

    function Result() {
      try {
        // Reemplaza % por /100 para que funcione como porcentaje
        let expr = output.value.replace(/%/g, '/100');
        output.value = Function('"use strict";return (' + expr + ')')();
      } catch {
        output.value = "Error";
      }
    }

    function Clear() {
      output.value = "";
    }

    function Back() {
      output.value = output.value.slice(0, -1);
    }
  </script>

</body>
</html>
