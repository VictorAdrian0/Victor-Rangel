<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unidad 2 - Tipos de Ataques</title>


  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/js/bootstrap.min.js"></script>

  <style>
    body {
      background-color: #e7f0f7;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      text-align: center;
    }

    .table img {
      max-width: 100px;
      height: auto;
    }

    .navbar {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar navbar-default">
    <div class="container">
      <div class="navbar-header">
        <a class="navbar-brand" href="index.html">Inicio</a>
      </div>
      <ul class="nav navbar-nav">
        <li class="dropdown">
          <a href="#" class="dropdown-toggle" data-toggle="dropdown">Unidades <b class="caret"></b></a>
          <ul class="dropdown-menu">
            <li><a href="ciberseguridad.html">Unidad conceptos</a></li>
            <li><a href="tabla.html">Unidad ataques</a></li>
            <li><a href="#">Unidad 3 - Protección</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <h1>Tipos de Ataques de Ciberseguridad</h1>

    <table class="table table-bordered table-striped" id="tablaCiberseguridad">
      <thead>
        <tr>
          <th>Ataque</th>
          <th>Descripción</th>
          <th>Impacto</th>
          <th>Ejemplo</th>
          <th>Imagen</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const ataques = [ 
      {
        ataque: "Phishing",
        descripcion: "Engaña al usuario para robar credenciales mediante correos falsos.",
        impacto: "Robo de identidad, pérdida de datos.",
        ejemplo: "Correo falso de un banco solicitando datos",
        imagen: "https://tse4.mm.bing.net/th/id/OIP.N-ksTyVihck6oZCYxCLSmwHaEK?rs=1&pid=ImgDetMain&o=7&rm=3"
      },
      {
        ataque: "Malware",
        descripcion: "Software malicioso que daña o explota sistemas.",
        impacto: "Pérdida de datos, control del sistema",
        ejemplo: "Troyano que permite acceso remoto",
        imagen: "https://img.icons8.com/color/96/virus.png"
      },
      {
        ataque: "Ransomware",
        descripcion: "Cifra archivos y exige rescate para liberarlos.",
        impacto: "Secuestro de datos y pérdida económica",
        ejemplo: "WannaCry afectó hospitales y empresas",
        imagen: "https://img.icons8.com/color/96/ransomware.png"
      },
      {
        ataque: "Denegación de servicio (DoS)",
        descripcion: "Satura un sistema para que no funcione.",
        impacto: "Interrupción del servicio",
        ejemplo: "Millones de solicitudes simultáneas a un sitio",
        imagen: "https://img.icons8.com/color/96/server.png"
      },
      {
        ataque: "DDoS",
        descripcion: "Ataque DoS desde múltiples dispositivos (botnet).",
        impacto: "Caída de servicios a gran escala",
        ejemplo: "Ataque a Dyn afectó Twitter y Netflix",
        imagen: "https://img.icons8.com/color/96/bot.png"
      },
      {
        ataque: "Inyección SQL",
        descripcion: "Inserta código SQL malicioso en formularios.",
        impacto: "Acceso a bases de datos no autorizado",
        ejemplo: "Extraer contraseñas de usuarios",
        imagen: "https://img.icons8.com/color/96/database.png"
      },
      {
        ataque: "Fuerza bruta",
        descripcion: "Adivina contraseñas por prueba y error.",
        impacto: "Compromiso de cuentas",
        ejemplo: "Script automatizado para ingresar a cuentas",
        imagen: "https://img.icons8.com/color/96/password.png"
      },
      {
        ataque: "Man-in-the-Middle (MitM)",
        descripcion: "Intercepta comunicaciones entre dos partes.",
        impacto: "Espionaje y robo de datos",
        ejemplo: "Captura de credenciales en Wi-Fi pública",
        imagen: "https://img.icons8.com/color/96/hacker.png"
      },
      {
        ataque: "Zero-Day",
        descripcion: "Explotación de una vulnerabilidad no conocida.",
        impacto: "Compromiso completo del sistema",
        ejemplo: "Malware que aprovecha falla sin parche",
        imagen: "https://img.icons8.com/color/96/bug.png"
      },
      {
        ataque: "Keylogger",
        descripcion: "Registra las pulsaciones de teclas.",
        impacto: "Robo de contraseñas",
        ejemplo: "Captura de datos al teclear",
        imagen: "https://img.icons8.com/color/96/keyboard.png"
      },
      {
        ataque: "XSS (Cross-Site Scripting)",
        descripcion: "Inyección de scripts en páginas web.",
        impacto: "Robo de cookies o redirecciones maliciosas",
        ejemplo: "Script inyectado en foros",
        imagen: "https://img.icons8.com/color/96/code.png"
      },
      {
        ataque: "Ingeniería Social",
        descripcion: "Engaño psicológico para obtener acceso o datos.",
        impacto: "Filtración de información",
        ejemplo: "Alguien se hace pasar por técnico",
        imagen: "https://img.icons8.com/color/96/social-engineering.png"
      }
    ];

    const cuerpoTabla = document.querySelector("#tablaCiberseguridad tbody");

    ataques.forEach(ataque => {
      const fila = document.createElement("tr");

      fila.innerHTML = `
        <td>${ataque.ataque}</td>
        <td>${ataque.descripcion}</td>
        <td>${ataque.impacto}</td>
        <td>${ataque.ejemplo}</td>
        <td><img src="${ataque.imagen}" alt="${ataque.ataque}"></td>
      `;

      cuerpoTabla.appendChild(fila);
    });
  </script>
</body>
</html>
